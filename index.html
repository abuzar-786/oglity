    <script>
      // Ensure window.fetch has both a getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter" errors in extension and test executor environments
      (function() {
        try {
          var nativeFetch = window.fetch;
          var _currentFetch = function() {
            return nativeFetch ? nativeFetch.apply(window, arguments) : Promise.resolve(new Response());
          };
          var fetchGetter = function() {
            return _currentFetch;
          };
          var fetchSetter = function(fn) {
            _currentFetch = fn;
          };

          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: fetchGetter,
              set: fetchSetter
            });
          } catch (_) {}

          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: fetchGetter,
                set: fetchSetter
              });
            }
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
